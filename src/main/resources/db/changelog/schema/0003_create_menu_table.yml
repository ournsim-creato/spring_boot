databaseChangeLog:
  - changeSet:
      id: 0003-create-menu-table
      author: yourname
      changes:
        - createTable:
            tableName: menu
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: title
                  type: VARCHAR(255)

              - column:
                  name: title_key
                  type: VARCHAR(255)

              - column:
                  name: path
                  type: VARCHAR(255)

              - column:
                  name: component
                  type: VARCHAR(255)

              - column:
                  name: redirect
                  type: VARCHAR(255)

              - column:
                  name: icon
                  type: VARCHAR(255)

              - column:
                  name: link
                  type: VARCHAR(255)

              - column:
                  name: sort_order
                  type: INT

              - column:
                  name: hidden
                  type: BOOLEAN
                  defaultValueBoolean: false

              - column:
                  name: no_cache
                  type: BOOLEAN
                  defaultValueBoolean: false

              - column:
                  name: always_show
                  type: BOOLEAN
                  defaultValueBoolean: false

              - column:
                  name: parent_id
                  type: BIGINT